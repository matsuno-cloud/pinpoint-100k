<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road to 100K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --fg: #111214;
    --muted: #7a7d85;
    --faint: #b9bcc3;
    --line: #ececee;
    --track: #f1f2f4;
    --accent: #2b5cff;
    --accent-soft: rgba(43, 92, 255, .10);
    --good: #12a150;
    --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919;
      --fg: #f3f4f6;
      --muted: #9a9ea8;
      --faint: #5b5f68;
      --line: #2a2b2e;
      --track: #26272a;
      --accent: #7f9cff;
      --accent-soft: rgba(127, 156, 255, .14);
      --good: #34d399;
      --warn: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --fg: #f3f4f6; --muted: #9a9ea8; --faint: #5b5f68;
    --line: #2a2b2e; --track: #26272a; --accent: #7f9cff;
    --accent-soft: rgba(127, 156, 255, .14); --good: #34d399; --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
    font-feature-settings: "tnum" 1, "ss01" 1;
    -webkit-font-smoothing: antialiased;
    padding: 20px 20px 16px;
    max-width: 760px;
  }
  .eyebrow {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .eyebrow .ch { letter-spacing: .04em; text-transform: none; font-weight: 500; }

  .hero { margin-top: 14px; }
  .hero .label { font-size: 12px; color: var(--muted); }
  .hero .date {
    font-size: clamp(30px, 8vw, 44px); font-weight: 700; letter-spacing: -.02em;
    line-height: 1.1; margin-top: 2px;
  }
  .hero .date .dow { font-size: .5em; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .hero .sub { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .hero .sub b { color: var(--fg); font-weight: 600; }

  .progress { margin-top: 16px; }
  .progress .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
  .progress .row .now { color: var(--fg); font-weight: 600; font-size: 15px; }
  .bar { height: 4px; background: var(--track); border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .8s cubic-bezier(.2,.8,.2,1); }

  .scen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 18px;
          background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .scen > div { background: var(--bg); padding: 10px 12px; }
  .scen .k { font-size: 11px; color: var(--muted); }
  .scen .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .scen .r { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .scen .main .v { color: var(--accent); }

  .flow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 18px; }
  .flow .step .k { font-size: 11px; color: var(--muted); }
  .flow .step .v { font-size: 17px; font-weight: 600; margin-top: 3px; letter-spacing: -.01em; }
  .flow .step.main .v { color: var(--warn); }
  .flow .gap { display: flex; flex-direction: column; align-items: center; font-size: 10.5px; color: var(--faint); min-width: 64px; }
  .flow .gap i { display: block; width: 100%; height: 1px; background: var(--line); margin-top: 4px; position: relative; }
  .flow .gap i::after { content: ""; position: absolute; right: -1px; top: -3px; border: 3.5px solid transparent; border-left: 5px solid var(--faint); }
  .flow .step.main { text-align: right; }
  .scen .r2 { font-size: 10.5px; color: var(--faint); }

  .chart { margin-top: 16px; position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-size: 10px; fill: var(--muted); font-family: inherit; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 2px solid var(--fg); }
  .legend .proj::before { border-top: 2px dashed var(--accent); }
  .legend .alt::before { border-top: 1px dashed var(--muted); }
  .legend .lv::before { border-top: 1px dashed var(--warn); }

  footer { margin-top: 10px; font-size: 10.5px; color: var(--faint); display: flex; justify-content: space-between; }
  .empty { margin-top: 18px; font-size: 13px; color: var(--muted); }

  @media (max-width: 380px) {
    body { padding: 16px; }
    .scen .r2 { display: none; }
    .scen > div { padding: 9px 9px; }
    .scen .r { font-size: 10px; }
    .flow { grid-template-columns: 1fr auto 1fr; gap: 6px; }
    .flow .step .k { font-size: 10px; }
    .flow .step .v { font-size: 14px; white-space: nowrap; }
    .flow .gap { min-width: 36px; }
  }
</style>
</head>
<body>
  <div class="eyebrow"><span>Road to 100K</span><span class="ch" id="ch">ピンポイント団</span></div>

  <section class="hero">
    <div class="label">このペースでいくと、10万人突破は</div>
    <div class="date" id="eta">—</div>
    <div class="sub" id="sub">データを読み込み中…</div>
  </section>

  <section class="progress">
    <div class="row"><span class="now" id="now">—</span><span id="goal">/ 100,000</span></div>
    <div class="bar"><i id="bar" style="width:0"></i></div>
  </section>

  <section class="scen" id="scen">
    <div><div class="k">楽観</div><div class="v" id="s-opt">—</div><div class="r" id="l-opt"></div><div class="r2" id="r-opt"></div></div>
    <div class="main"><div class="k">標準</div><div class="v" id="s-std">—</div><div class="r" id="l-std"></div><div class="r2" id="r-std"></div></div>
    <div><div class="k">悲観</div><div class="v" id="s-pes">—</div><div class="r" id="l-pes"></div><div class="r2" id="r-pes"></div></div>
  </section>

  <section class="flow">
    <div class="step"><div class="k">10万人達成・チケット販売</div><div class="v" id="f-ticket">—</div></div>
    <div class="gap"><span id="f-gap">約1か月</span><i></i></div>
    <div class="step main"><div class="k">本番候補（土日）</div><div class="v" id="f-live">—</div></div>
  </section>

  <section class="chart">
    <svg id="svg" viewBox="0 0 720 240" role="img" aria-label="登録者数の推移と予測"></svg>
    <div class="legend"><span>実績</span><span class="proj">標準</span><span class="alt">楽観・悲観</span><span class="lv">本番候補</span></div>
  </section>

  <footer><span id="updated"></span><span>直近のペースから毎日自動計算</span></footer>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const DAY = 86400000;
  const fmt = (n) => Math.round(n).toLocaleString("ja-JP");
  const DOW = ["日", "月", "火", "水", "木", "金", "土"];
  const parse = (s) => new Date(s + "T00:00:00+09:00");
  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  const wd = (d) => `${md(d)}(${DOW[d.getDay()]})`;
  // 到達日から offset 日後以降で最初の土日
  const weekend = (d) => {
    const base = new Date(d.getTime() + LIVE_OFFSET * DAY);
    const sun = new Date(base.getTime() + ((7 - base.getDay()) % 7) * DAY);
    return { sat: new Date(sun.getTime() - DAY), sun };
  };
  const wkLabel = (w) => w.sat.getMonth() === w.sun.getMonth()
    ? `${md(w.sat)}(土)・${w.sun.getDate()}(日)` : `${md(w.sat)}(土)・${md(w.sun)}(日)`;
  let LIVE_OFFSET = 30;
  const ymd = (d) => `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;

  let config, history;
  try {
    const bust = "?t=" + Date.now();
    [config, history] = await Promise.all([
      fetch("data/config.json" + bust).then((r) => r.json()),
      fetch("data/history.json" + bust).then((r) => r.json()),
    ]);
  } catch (e) {
    $("sub").textContent = "データを読み込めませんでした";
    return;
  }

  const goal = config.goal || 100000;
  LIVE_OFFSET = config.liveOffsetDays ?? 30;
  const pts = (history.points || [])
    .map((p) => ({ t: parse(p.date).getTime(), v: p.subs }))
    .sort((a, b) => a.t - b.t);

  $("goal").textContent = "/ " + fmt(goal);
  if (config.channelName) $("ch").textContent = config.channelName;
  if (history.updatedAt) {
    const u = new Date(history.updatedAt);
    $("updated").textContent = `最終更新 ${u.getMonth() + 1}/${u.getDate()} ${String(u.getHours()).padStart(2, "0")}:${String(u.getMinutes()).padStart(2, "0")}`;
  }

  if (pts.length < 2) {
    $("sub").textContent = "データを集めています。数日分たまると予測が表示されます。";
    if (pts.length) { $("now").textContent = fmt(pts[0].v) + "人"; $("bar").style.width = Math.min(100, pts[0].v / goal * 100) + "%"; }
    return;
  }

  const last = pts[pts.length - 1];
  const cur = last.v;

  // 直近 n 日の回帰直線の傾き（人/日）
  function slope(days) {
    const from = last.t - days * DAY;
    const s = pts.filter((p) => p.t >= from);
    if (s.length < 2) return null;
    const xs = s.map((p) => (p.t - from) / DAY), ys = s.map((p) => p.v);
    const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
    let num = 0, den = 0;
    xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
    return den ? num / den : null;
  }
  const windows = (config.windows || [7, 14, 28, 56]).map((d) => ({ d, s: slope(d) })).filter((w) => w.s !== null);
  const stdWin = config.standardWindow || 28;
  const std = (windows.find((w) => w.d === stdWin) || windows[windows.length - 1]).s;
  const all = windows.map((w) => w.s);
  const opt = Math.max(...all), pes = Math.min(...all);

  const eta = (rate) => (rate > 0 ? new Date(last.t + Math.ceil((goal - cur) / rate) * DAY) : null);
  const reached = cur >= goal;
  const eStd = reached ? null : eta(std);

  // Hero
  $("now").textContent = fmt(cur) + "人";
  requestAnimationFrame(() => ($("bar").style.width = Math.min(100, (cur / goal) * 100) + "%"));
  if (reached) {
    $("eta").innerHTML = "達成済み";
    $("sub").innerHTML = `現在 <b>${fmt(cur)}</b>人`;
  } else if (eStd) {
    $("eta").innerHTML = `${ymd(eStd)}<span class="dow">(${DOW[eStd.getDay()]})</span>`;
    const days = Math.round((eStd - parse(new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10))) / DAY);
    $("sub").innerHTML = `あと <b>${fmt(goal - cur)}</b>人 ・ 1日平均 <b>+${fmt(std)}</b>人 ・ 約<b>${days}</b>日後`;
  } else {
    $("eta").textContent = "予測できません";
    $("sub").textContent = "直近のペースが横ばいか減少しています";
  }

  // シナリオ
  const put = (id, rate) => {
    const e = eta(rate);
    $("s-" + id).textContent = reached ? "—" : e ? md(e) : "—";
    $("r-" + id).textContent = rate > 0 ? `+${fmt(rate)}/日` : "";
    $("l-" + id).textContent = !reached && e ? "本番 " + wkLabel(weekend(e)) : "";
  };
  put("opt", opt); put("std", std); put("pes", pes);

  // チケット販売開始 → 本番候補
  const tStart = reached ? new Date(last.t) : eStd;
  if (tStart) {
    $("f-ticket").textContent = wd(tStart);
    $("f-live").textContent = wkLabel(weekend(tStart));
    $("f-gap").textContent = `約${Math.round(LIVE_OFFSET / 30)}か月`;
  }

  // チャート
  const svg = $("svg");
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 150); });
  draw();
  function draw() {
  svg.innerHTML = "";
  const W = Math.max(280, Math.round(svg.getBoundingClientRect().width || 720));
  const H = Math.round(Math.min(260, Math.max(170, W * 0.36))), L = 40, R = 6, T = 14, B = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const showFrom = last.t - (config.chartDays || 90) * DAY;
  const real = pts.filter((p) => p.t >= showFrom);
  const liveT = tStart ? weekend(tStart).sat.getTime() : null;
  const eOpt = reached ? null : eta(opt), ePes = reached ? null : eta(pes);
  let endT = Math.max(eStd ? eStd.getTime() : last.t, ePes ? ePes.getTime() : 0, liveT || 0, last.t) + 7 * DAY;
  endT = Math.min(endT, last.t + 365 * DAY);
  const minV = Math.min(...real.map((p) => p.v));
  const maxV = Math.max(goal, cur);
  const pad = (maxV - minV) * 0.08 || 100;
  const y0 = minV - pad, y1 = maxV + pad;
  const sx = (t) => L + ((t - real[0].t) / (endT - real[0].t)) * (W - L - R);
  const sy = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const ns = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent = svg) => { const n = document.createElementNS(ns, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };

  // 目盛り
  const step = Math.pow(10, Math.floor(Math.log10((y1 - y0) / 3)));
  const nice = [1, 2, 5].map((m) => m * step).find((s) => (y1 - y0) / s <= 5) || step * 10;
  for (let v = Math.ceil(y0 / nice) * nice; v <= y1; v += nice) {
    el("line", { x1: L, x2: W - R, y1: sy(v), y2: sy(v), stroke: "var(--line)", "stroke-width": 1 });
    const t = el("text", { x: L - 8, y: sy(v) + 3, "text-anchor": "end" });
    t.textContent = v >= 10000 ? (v / 10000).toFixed(v % 10000 ? 1 : 0) + "万" : fmt(v);
  }
  // 月の目盛り
  const d0 = new Date(real[0].t);
  for (let d = new Date(d0.getFullYear(), d0.getMonth() + 1, 1); d.getTime() <= endT; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const t = el("text", { x: sx(d.getTime()), y: H - 6, "text-anchor": "middle" });
    t.textContent = d.getMonth() === 0 ? `${d.getFullYear()}/1` : `${d.getMonth() + 1}月`;
  }
  // 目標ライン
  el("line", { x1: L, x2: W - R, y1: sy(goal), y2: sy(goal), stroke: "var(--faint)", "stroke-width": 1 });
  const gl = el("text", { x: L + 4, y: sy(goal) - 5, "text-anchor": "start", style: "font-weight:600;fill:var(--fg)" });
  gl.textContent = "100,000";
  // 本番日
  if (liveT && liveT <= endT) {
    el("line", { x1: sx(liveT), x2: sx(liveT), y1: T, y2: H - B, stroke: "var(--warn)", "stroke-width": 1, "stroke-dasharray": "3 3" });
    const lt = el("text", { x: sx(liveT) - 5, y: H - B - 6, "text-anchor": "end", style: "fill:var(--warn)" });
    lt.textContent = "本番候補 " + md(new Date(liveT));
  }
  // 実績エリア
  const linePath = real.map((p, i) => `${i ? "L" : "M"}${sx(p.t).toFixed(1)},${sy(p.v).toFixed(1)}`).join("");
  const grad = el("linearGradient", { id: "g", x1: 0, x2: 0, y1: 0, y2: 1 }, el("defs", {}));
  el("stop", { offset: "0", "stop-color": "var(--accent)", "stop-opacity": ".18" }, grad);
  el("stop", { offset: "1", "stop-color": "var(--accent)", "stop-opacity": "0" }, grad);
  el("path", { d: `${linePath}L${sx(last.t)},${H - B}L${sx(real[0].t)},${H - B}Z`, fill: "url(#g)" });
  el("path", { d: linePath, fill: "none", stroke: "var(--fg)", "stroke-width": 1.8, "stroke-linejoin": "round", "stroke-linecap": "round" });
  // 楽観〜悲観の幅
  if (!reached && eOpt && ePes) {
    const px = Math.min(sx(ePes.getTime()), W - R);
    const py = sx(ePes.getTime()) > W - R ? sy(cur + pes * ((endT - last.t) / DAY)) : sy(goal);
    el("path", { d: `M${sx(last.t)},${sy(cur)}L${sx(eOpt.getTime())},${sy(goal)}L${px},${py}Z`, fill: "var(--accent-soft)", stroke: "none" });
    for (const [e, name] of [[eOpt, "楽観"], [ePes, "悲観"]]) {
      const x2 = Math.min(sx(e.getTime()), W - R);
      const y2 = sx(e.getTime()) > W - R ? py : sy(goal);
      el("path", { d: `M${sx(last.t)},${sy(cur)}L${x2},${y2}`, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "2 3", fill: "none" });
      const nearStd = eStd && Math.abs(x2 - sx(eStd.getTime())) < 34;
      if (x2 === sx(e.getTime()) && !nearStd) {
        el("circle", { cx: x2, cy: y2, r: 2.5, fill: "var(--muted)" });
        const edge = x2 > W - R - 40;
        const lab = el("text", { x: edge ? x2 + 2 : x2, y: y2 - 7, "text-anchor": edge ? "end" : "middle" });
        lab.textContent = `${name} ${md(e)}`;
      }
    }
  }
  // 予測ライン
  if (eStd && !reached) {
    el("path", { d: `M${sx(last.t)},${sy(cur)}L${sx(eStd.getTime())},${sy(goal)}`, stroke: "var(--accent)", "stroke-width": 1.8, "stroke-dasharray": "5 4", fill: "none" });
    el("circle", { cx: sx(eStd.getTime()), cy: sy(goal), r: 4.5, fill: "var(--accent)" });
    el("circle", { cx: sx(eStd.getTime()), cy: sy(goal), r: 9, fill: "var(--accent-soft)" });
    const eNear = sx(eStd.getTime()) > W - R - 110;
    const et = el("text", { x: sx(eStd.getTime()) + (eNear ? -8 : 8), y: sy(goal) + 26, "text-anchor": eNear ? "end" : "start", style: "fill:var(--accent);font-weight:600" });
    et.textContent = "チケット販売開始 " + md(eStd);
  }
  el("circle", { cx: sx(last.t), cy: sy(cur), r: 3.5, fill: "var(--bg)", stroke: "var(--fg)", "stroke-width": 1.8 });
  }
})();
</script>
</body>
</html>
